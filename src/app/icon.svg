<svg width="400" height="280" viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg">

  <!-- Background -->
  <rect width="100%" height="100%" fill="white"/>

  <!-- Left Kanji -->
  <text x="80" y="135"
        text-anchor="middle"
        font-size="150"
        font-family="'Noto Serif JP', 'Hiragino Mincho ProN', serif"
        font-weight="700"
        fill="black">
    東
  </text>

  <!-- Right Kanji -->
  <text x="320" y="130"
        text-anchor="middle"
        font-size="150"
        font-family="'Noto Serif JP', 'Hiragino Mincho ProN', serif"
        font-weight="700"
        fill="black">
    京
  </text>

  <!-- Red Circle -->
  <circle cx="200" cy="80" r="40" fill="#E60012"/>

  <!-- TOKYO -->
  <text x="200" y="240"
        text-anchor="middle"
        font-size="100"
        font-family="'Playfair Display', serif"
        letter-spacing="5"
        fill="black">
